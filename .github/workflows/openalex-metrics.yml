name: Refresh OpenAlex metrics

on:
  schedule:
    - cron: "0 5 * * 1"   # every Monday at 05:00 UTC
  workflow_dispatch:        # allow manual run from GitHub UI

permissions:
  contents: write

jobs:
  fetch-metrics:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::openalexR
            any::jsonlite
            any::purrr
            any::dplyr
          cache-version: 1

      - name: Fetch OpenAlex metrics
        run: Rscript fetch_openalex_metrics.R

      - name: Commit updated metrics
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/openalex_metrics.json
          git diff --cached --quiet || git commit -m "chore: refresh OpenAlex citation metrics [skip ci]"
          git push